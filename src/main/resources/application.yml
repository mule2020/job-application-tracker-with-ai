spring:
  application:
    name: job-application-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}

groq:
  api-key: ${GROQ_API_KEY}
  model: ${GROQ_MODEL}

brevo:
  api-key: ${BREVO_API_KEY}

app:
  frontend-url: ${APP_FRONTEND_URL}
  mail-from: ${MAIL_FROM}

springdoc:
  packages-to-scan: com.muluken.jobtracker
  paths-to-match: /api/**
  swagger-ui:
    url: /v3/api-docs

adzuna:
  app-id: ${ADZUNA_APP_ID}
  app-key: ${ADZUNA_APP_KEY}
  base-url: https://api.adzuna.com/v1/api/jobs

logging:
  level:
    com.muluken: DEBUG
    root: INFO