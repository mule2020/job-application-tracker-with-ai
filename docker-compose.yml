
  services:
    postgres:
      image: postgres:16
      container_name: jobtracker-postgres

      environment:
        POSTGRES_DB: jobtracker_db
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin123

      ports:
        - "5434:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:

